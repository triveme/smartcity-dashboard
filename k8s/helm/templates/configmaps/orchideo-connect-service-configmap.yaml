{{- if index .Values "orchideo-connect-service" "enabled" }}
# Env vars specific for the dashboard-service nestjs microservice
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchideo-connect-service-configmap
data:
  NODE_ENV: "development"
  NEST_JWKS_URI: {{ index .Values "orchideo-connect-service" "jwks" }}
  NEXT_PUBLIC_FRONTEND_URL: {{ index .Values "orchideo-connect-service" "frontendUrl" }}
  DATA_PLATFORM_QUEUE_CONCURRENCY: {{ index .Values "orchideo-connect-service" "queue" "concurrency" | quote }}
  DATA_PLATFORM_QUEUE_TIMEOUT_MS: {{ index .Values "orchideo-connect-service" "queue" "timeoutMs" | quote }}
{{- end }}
